version: '3.8'

services:
  backend:
    build:
      context: .
      file: backend/Dockerfile
    container_name: niriksha-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - niriksha-net

  frontend:
    build:
      context: .
      file: frontend/Dockerfile
    container_name: niriksha-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - niriksha-net

networks:
  niriksha-net:
    driver: bridge
