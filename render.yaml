# Render Blueprint Specification (Infrastructure-as-Code)
# Deploys NIRIKSHA Backend (Web Service) and NIRIKSHA Frontend (Static Site)
services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Analytical Backend Service
  # ---------------------------------------------------------------------------
  - type: web
    name: niriksha-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && pip install -r backend/requirements.txt && python src/db_builder.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: 10000

  # ---------------------------------------------------------------------------
  # 2. React 19 + Vite Frontend (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: niriksha-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: niriksha-backend
          property: host
